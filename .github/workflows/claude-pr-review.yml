name: Claude PR Security Review

# Advisory only, by design (ADR-026) - this check is NOT required and cannot
# block a merge. Runs alongside, not instead of, the existing
# security-reviewer/code-reviewer subagent pass.
#
# Trigger is `pull_request` ONLY, never `pull_request_target` - a fork PR's
# title/body/diff/comments are untrusted content, and `pull_request_target`
# would run this with base-repo secrets against attacker-controlled input.
# `pull_request` runs with the PR's own (minimal, read-only-plus-comment)
# permissions and no access to repo secrets beyond what this workflow itself
# grants, so a malicious PR can at most get a bad review comment posted, not
# exfiltrate anything.
#
# `paths:` restricts triggering to actual code changes - this review runs
# against the founder's Claude Pro subscription quota (see below), shared
# with his own interactive Claude Code sessions, not separate API billing,
# so a docs-only or fixture-only PR shouldn't spend any of it.
on:
  pull_request:
    # `ready_for_review` is required here, not optional - a PR opened as a
    # draft (the job below skips drafts) and later marked ready never fires
    # `opened` or `synchronize` again, so without this event it would never
    # get reviewed at all. Found during the 2026-10-09 throwaway-PR
    # verification: `gh pr create` without `--draft` can still land as a
    # draft depending on repo/CLI defaults, and marking it ready produced no
    # new run until this event type was added.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "requirements-freeze.txt"
      - "pyproject.toml"
      - ".github/workflows/**"

# Minimal permissions (ADR-026 Amendment 1): contents:read + pull-requests:write
# is the comment-only surface this job needs. id-token:write is DROPPED here -
# the action's own FAQ confirms the GitHub-OIDC-to-App-token exchange (the
# thing id-token:write exists for) only runs when no `github_token` input is
# supplied; passing `github_token` below (the default workflow token, scoped
# to exactly this permissions: block) makes that exchange unnecessary and
# avoids depending on the Claude GitHub App being installed at all. This is
# an experiment at commit time - the throwaway-PR verification after this
# merges is the actual proof. If a run ever fails demanding an OIDC token,
# restore id-token:write in a follow-up fix rather than assuming this holds.
# Deliberately omits security-events:write (SARIF upload) - unused, nothing
# in this job uploads a code-scanning result.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip draft PRs - no point spending subscription quota on a PR the
    # author isn't ready for feedback on yet.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Pinned to a full commit SHA (not a tag) per ADR-026 - verified
      # directly against the real anthropics/claude-code-action repo
      # (`git ls-remote`, and tag v1.0.247 dereferences to this exact
      # commit) rather than trusted from any single source.
      #
      # Anthropic credential: CLAUDE_CODE_OAUTH_TOKEN (the founder's Claude
      # Pro subscription, generated via `claude setup-token` locally), NOT
      # ANTHROPIC_API_KEY - confirmed via `gh secret list` that no
      # Anthropic credential existed in this repo before the founder added
      # this one; the only pre-existing secrets anywhere were the
      # deploy-only VPS_SSH_HOST/VPS_SSH_PRIVATE_KEY pair, correctly left
      # untouched. Using an OAuth token here means these review runs use
      # the founder's subscription usage limits (shared with his own
      # interactive Claude Code sessions) instead of separate per-token API
      # billing - see ADR-026's cost/trade-off section. Never echo this
      # token's value in any step - it is referenced only via the action's
      # own `claude_code_oauth_token` input below.
      #
      # GitHub credential: the default workflow GITHUB_TOKEN (ADR-026
      # Amendment 1), NOT the Claude GitHub App. Verified in the action's own
      # FAQ: "if you wish to not use the GitHub app, you can instead provide
      # a github_token input to the action for Claude to operate with."
      # Trade-off, accepted: comments post as the generic Actions bot
      # identity rather than claude[bot], and the sticky-comment feature
      # (one updating comment per PR) doesn't work without claude[bot] auth.
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is api.pdfconverterai.com, a FastAPI backend (Handbook Part C - see
            CLAUDE.md for module boundaries, SSRF/network-security conventions, and
            the "no leftover branding / no exposed secrets" acceptance criteria).

            Perform a security-focused review of this pull request:

            ## OWASP Top 10 / backend-specific checks
            - SQL/NoSQL injection, command injection, SSRF (this codebase has had
              real SSRF findings before - check any caller-supplied-URL fetch for
              `assert_host_is_safe`/pinned-resolver usage, matching existing
              patterns in app/shared/web/)
            - Broken authentication/authorization, missing `require_admin`/API-key
              checks on new routes
            - Hardcoded secrets or credentials, logging that could leak secrets or
              PII
            - Unsafe deserialization, unbounded reads from an external response
              (this codebase has had real "under-read despite a cap" and
              "no cap at all" bugs before)
            - Race conditions / TOCTOU issues

            Rate severity as CRITICAL, HIGH, MEDIUM, LOW, or NONE for each finding.

            Use `gh pr comment` for a top-level summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific lines.
            Only post GitHub comments - don't submit review text as chat messages.
            This review is advisory only and does not replace the repo's own
            security-reviewer/code-reviewer subagent pass - say so in the summary
            comment.

          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
