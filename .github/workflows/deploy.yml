name: Deploy (manual)

# Manual-trigger only, by design - CI (ci.yml) runs automatically on every PR,
# but an actual VPS deploy stays a deliberate, explicit action (Handbook Part
# D.1 "founder review + explicit merge decision" workflow). Merging to main
# does NOT deploy anything by itself; someone has to come here and press
# "Run workflow".
on:
  workflow_dispatch:
    inputs:
      restart_worker:
        description: "Also restart arq-worker.service (needed if worker/job-processing code changed)"
        type: boolean
        default: true

# Workflow never calls the GitHub API - default to no permissions rather than
# inheriting the broad default GITHUB_TOKEN grant.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # BACKEND_DEPLOY_PATH is a repo Variable (Settings > Secrets and
      # variables > Actions > Variables), not a Secret - it's not sensitive,
      # just easier to fix if wrong without editing this file. Best-guess
      # default is /home/pdfconverterai-api/htdocs/api.pdfconverterai.com
      # (inferred from app/core/config.py's downloaders_log_path /
      # model_path defaults) - VERIFY this against the real VPS path before
      # first use.
      - name: Deploy
        # SECURITY: never splice ${{ }} expressions directly into the run:
        # heredoc below - GitHub substitutes them as raw text BEFORE any
        # shell parses the script, so a crafted workflow_dispatch input
        # (attacker-controllable via the REST/CLI dispatch API, regardless
        # of the `type: boolean` UI hint) can inject arbitrary commands that
        # execute as root on the VPS. Route both values through env: instead
        # so they go through normal shell variable substitution.
        env:
          RESTART_WORKER: ${{ inputs.restart_worker }}
          DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
        run: |
          set -e

          # Defense in depth: fail fast locally (before anything is sent
          # over ssh) if either input doesn't look like what it's supposed
          # to be, rather than trusting the `type: boolean` hint to have
          # been enforced server-side.
          if [ "$RESTART_WORKER" != "true" ] && [ "$RESTART_WORKER" != "false" ]; then
            echo "::error::restart_worker must be 'true' or 'false', got: $RESTART_WORKER" >&2
            exit 1
          fi
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::BACKEND_DEPLOY_PATH must be an absolute path, got: $DEPLOY_PATH" >&2; exit 1 ;;
          esac

          # RESTART_WORKER/DEPLOY_PATH only exist in this runner's shell -
          # the heredoc below is sent as a literal script to a REMOTE shell
          # over ssh, which has its own, separate environment. printf %q
          # shell-quotes each value into a single opaque token before it's
          # embedded in the remote command string, so the remote shell sets
          # them as real (exported) environment variables for the `bash -s`
          # it spawns, instead of re-parsing attacker-controlled text as
          # shell syntax. The heredoc delimiter is quoted ('EOF') so this
          # runner's shell does NOT expand $RESTART_WORKER/$DEPLOY_PATH
          # itself - expansion happens remotely, using the remote shell's
          # own (safely-set) environment variables.
          REMOTE_RESTART_WORKER=$(printf '%q' "$RESTART_WORKER")
          REMOTE_DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH")

          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_SSH_HOST }} \
            "RESTART_WORKER=$REMOTE_RESTART_WORKER DEPLOY_PATH=$REMOTE_DEPLOY_PATH bash -s" <<'EOF'
            set -e
            echo "--- git pull (as pdfconverterai-api) ---"
            sudo -u pdfconverterai-api git -C "$DEPLOY_PATH" pull origin main

            echo "--- restart gunicorn.service ---"
            sudo systemctl restart gunicorn.service

            if [ "$RESTART_WORKER" = "true" ]; then
              echo "--- restart arq-worker.service ---"
              sudo systemctl restart arq-worker.service
            fi

            sleep 3
            echo "--- health check ---"
            curl -fsS https://api.pdfconverterai.com/health
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
